<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-label="云栖花园周边生活圈示意地图">
        <rect x="0" y="0" width="520" height="440" fill="#faf8f1"/>
        <g stroke="#e7e1d3" stroke-width="1">
          <path d="M0 80H520M0 160H520M0 320H520M0 400H520"/>
          <path d="M80 0V440M200 0V440M300 0V440M420 0V440"/>
        </g>
        <!-- 云栖河 -->
        <path d="M462 -10 C450 90 444 150 438 240 C432 330 428 380 424 450" stroke="#8fb0bb" stroke-width="30" fill="none" opacity=".55"/>
        <text x="446" y="62" font-size="10.5" fill="#2d5c70" writing-mode="vertical-rl" letter-spacing="2">云栖河</text>
        <!-- 街区 -->
        <g fill="#efe9dc" stroke="#ddd4c1" stroke-width=".8">
          <rect x="88" y="88" width="104" height="64"/>
          <rect x="210" y="88" width="82" height="64"/>
          <rect x="88" y="176" width="104" height="136"/>
          <rect x="210" y="176" width="82" height="56"/>
          <rect x="88" y="328" width="104" height="64"/>
          <rect x="210" y="328" width="82" height="64"/>
          <rect x="308" y="176" width="50" height="56"/>
          <rect x="308" y="88" width="50" height="64"/>
        </g>
        <g font-size="9" fill="#7b8794" letter-spacing="1">
          <text x="96" y="106">云栖新村</text>
          <text x="216" y="106">桥北口</text>
          <text x="96" y="194">花园里</text>
          <text x="216" y="194">老街口</text>
          <text x="96" y="346">育才坊</text>
          <text x="216" y="346">河口</text>
          <text x="314" y="106">屏岭脚</text>
          <text x="314" y="194">河西湾</text>
        </g>
        <!-- 道路 -->
        <path d="M300 0V440" stroke="#cfc6b4" stroke-width="9"/>
        <path d="M300 0V440" stroke="#faf8f1" stroke-width="1" stroke-dasharray="6 10"/>
        <text x="306" y="26" font-size="10" fill="#45525f" letter-spacing="2">云栖路</text>
        <path d="M120 330H430" stroke="#cfc6b4" stroke-width="7"/>
        <text x="126" y="322" font-size="10" fill="#45525f" letter-spacing="2">育才路</text>
        <!-- 步行路线 -->
        <path id="routePath" d="M300 240 L300 330 L178 330" stroke="#9c6b43" stroke-width="3" stroke-dasharray="7 5" fill="none" opacity=".35"/>
        <text id="routeLabel" x="236" y="318" font-size="9.5" fill="#9c6b43">1.0 km · 13 min</text>
        <!-- POI -->
        <g aria-label="云栖花园">
          <circle cx="300" cy="240" r="13" fill="#2d5c70" stroke="#f4f1e8" stroke-width="2"/>
          <text x="300" y="244" font-size="10" fill="#fff" text-anchor="middle">1</text>
          <text x="316" y="234" font-size="10.5" fill="#1b2631">云栖花园</text>
        </g>
        <g aria-label="云栖菜市场">
          <circle cx="344" cy="148" r="11" fill="#9c6b43" stroke="#f4f1e8" stroke-width="2"/>
          <text x="344" y="152" font-size="10" fill="#fff" text-anchor="middle">2</text>
          <text x="358" y="142" font-size="10" fill="#1b2631">菜市场</text>
        </g>
        <g aria-label="云栖街道办事处">
          <circle cx="376" cy="112" r="10" fill="#45525f" stroke="#f4f1e8" stroke-width="2"/>
          <text x="376" y="116" font-size="10" fill="#fff" text-anchor="middle">3</text>
          <text x="388" y="106" font-size="9.5" fill="#1b2631">街道办</text>
        </g>
        <g aria-label="北城社区医院">
          <circle cx="398" cy="252" r="11" fill="#45525f" stroke="#f4f1e8" stroke-width="2"/>
          <text x="398" y="256" font-size="10" fill="#fff" text-anchor="middle">4</text>
          <text x="410" y="246" font-size="9.5" fill="#1b2631">社区医院</text>
        </g>
        <g aria-label="云栖花园公交站">
          <circle cx="262" cy="276" r="9" fill="#5d8697" stroke="#f4f1e8" stroke-width="2"/>
          <text x="262" y="279" font-size="9" fill="#fff" text-anchor="middle">5</text>
          <text x="196" y="270" font-size="9.5" fill="#1b2631">公交站</text>
        </g>
        <g aria-label="第二小学">
          <circle cx="178" cy="330" r="13" fill="#9c6b43" stroke="#f4f1e8" stroke-width="2"/>
          <text x="178" y="334" font-size="10" fill="#fff" text-anchor="middle">6</text>
          <text x="120" y="358" font-size="10.5" fill="#1b2631">第二小学</text>
        </g>
        <g aria-label="云栖河人行桥">
          <circle cx="438" cy="404" r="9" fill="#5d8697" stroke="#f4f1e8" stroke-width="2"/>
          <text x="438" y="407" font-size="9" fill="#fff" text-anchor="middle">7</text>
          <text x="424" y="424" font-size="9.5" fill="#1b2631" text-anchor="end">人行桥 · 向南</text>
        </g>
        <!-- 指北与比例 -->
        <g transform="translate(472,378)">
          <path d="M0 0V-30" stroke="#45525f" stroke-width="1.2"/>
          <path d="M-5 -24L0 -34L5 -24" fill="none" stroke="#45525f" stroke-width="1.2"/>
          <text x="-3" y="-38" font-size="9" fill="#45525f">N</text>
        </g>
        <g transform="translate(26,414)">
          <path d="M0 0H42" stroke="#45525f" stroke-width="1"/>
          <path d="M0 -3V3M42 -3V3" stroke="#45525f" stroke-width="1"/>
          <text x="0" y="-6" font-size="8.5" fill="#7b8794">约 200 m（示意）</text>
        </g>
      </svg>
