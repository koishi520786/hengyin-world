name: temporary-sync
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download changed bundle
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error -o /tmp/hengyin.tar.gz "https://aka.doubaocdn.com/s/CugrVRA4JO"
          tar -xzf /tmp/hengyin.tar.gz -C "$GITHUB_WORKSPACE"
      - name: Commit bundle and remove workflow
        run: |
          set -euo pipefail
          git rm -f .github/workflows/temporary-sync.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 1
          fi
          git config user.name "koishi520786"
          git config user.email "215965098+koishi520786@users.noreply.github.com"
          git commit -m "优化开局时间与现实/游戏任务边界"
          git push
